name: Chainlab integrity prototype checks
on:
  push:
    branches: [main, 'build/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q chainlab.py tests
      - run: python -m unittest discover -s tests -v
      - run: python chainlab.py --input demo.json
      - run: python scripts/cli_e2e.py
